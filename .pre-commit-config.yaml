# Pre-commit hooks for Markdown knowledge bases / docs repos.
#
# Mostly markdown, but not only: this repository keeps a plan record whose format
# a tool owns, and ADR-executable-artifacts-in-the-library requires a shipped or
# consumed artifact to be gated
# rather than asserted. Those gates live at the end of this file.
#
# Design goals:
#   - Autofix where possible; gate where not. Sane defaults, not bureaucratic.
#   - Stable canonical markdown (small diffs, predictable LLM tokens).
#   - Per-stage budget:
#       pre-commit  : fast, local, deterministic.
#       pre-push    : slower, network-aware (link check).
#       commit-msg  : Conventional Commits shape.
#
# Tool provisioning:
#   Hooks marked `language: system` (dprint, typos, committed) get no
#   environment of their own and resolve off the ambient PATH. flake.nix is the
#   single provider — enter the shell (`direnv allow`, or `nix develop
#   --command ...` when non-interactive) before running them. Adding another
#   such hook means adding its package to the devShell in the same change.
#   The three plan-record hooks at the end are in this class twice over: their
#   tools come from the pinned plan-xp input rather than from nixpkgs, so a
#   commit made outside the shell cannot see them. Each says so rather than
#   dying on a bare ENOENT.
#
# Tooling stack (and what each owns):
#   - pre-commit-hooks : whitespace, line endings, basic safety.
#   - editorconfig-ec  : honor .editorconfig.
#   - dprint           : canonical CommonMark/GFM formatter (autofix).
#                        System binary; config in `./dprint.json`.
#   - md-toc           : keep `<!--TOC-->` blocks in sync (autofix).
#   - markdownlint-cli2: style gate beyond what dprint enforces, plus the one
#                        autofix dprint can't do — ordered-list renumbering
#                        (MD029). dprint owns all other formatting.
#   - typos            : conservative spell check (report-only; SoT: _typos.toml).
#   - ripsecrets       : secret scanner (fast).
#   - lychee           : link checker (pre-push only; network).
#   - no-bare-relative-links : forbid bare-filename relative links (explicit ./ or path).
#   - committed        : Conventional Commits shape on commit-msg (SoT: committed.toml).
#
# First-run note:
#   dprint will rewrite every .md file once. Run
#     `pre-commit run --all-files`
#   and commit the result as a single "chore: dprint baseline" commit
#   before turning hooks loose on normal work.

default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  # --- Housekeeping (auto-fix where possible) ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]   # keep two-space hard breaks
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: ['--maxkb=16384']
      - id: check-case-conflict
      - id: check-merge-conflict
        args: ['--assume-in-merge']
      - id: destroyed-symlinks
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key

  # --- JSON/JSONC syntax gate ---
  #
  # check-json5 parses JSON that is valid JSON5 — comments and trailing commas
  # included — so it won't false-fail on the .jsonc / commented .json config a
  # docs repo carries (e.g. .markdownlint-cli2.jsonc, dprint.json). It is the
  # syntax gate only; canonical formatting/autofix is owned by the dprint json
  # plugin below. (The stock pretty-format-json hook is deliberately not used:
  # it rejects comments and can't format JSONC.)
  - repo: https://gitlab.com/bmares/check-json5
    rev: v1.0.1
    hooks:
      - id: check-json5

  # --- EditorConfig ---
  #
  # Honors the shared .editorconfig baseline. Two tailored args:
  #   -disable-insert-final-newline : end-of-file-fixer (and dprint) already
  #       own final-newline normalization; running both double-reports.
  #   *.md exclusion : markdown formatting is owned by dprint + markdownlint,
  #       and .editorconfig deliberately relaxes trailing-whitespace / line
  #       length for *.md, so ec must not police markdown.
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v3.7.0
    hooks:
      - id: editorconfig-checker
        alias: ec
        args: [-disable-insert-final-newline]
        exclude: '\.md$'

  # --- Formatter: dprint (canonical Markdown + JSON/JSONC) ---
  #
  # dprint is the single source of truth for whitespace, list style,
  # emphasis, table padding, etc. Configure via the sibling `./dprint.json`
  # at the repo root. Plugin URLs/versions are pinned inside dprint.json
  # (markdown + json), so the hook covers .md, .json and .jsonc.
  #
  # The json plugin gives comment-safe JSONC autofix (comments + trailing
  # commas survive), which is why it replaces pretty-format-json here;
  # check-json5 above stays the pure syntax gate.
  #
  # The textWrap=maintain rationale, MD029 renumbering, fix-mode isolation, and
  # the SoT decision are documented in this project's markdown formatting
  # toolchain notes.
  #
  # External dependency: dprint must be on PATH (e.g., `cargo install dprint`
  # or your package manager). Pinned through dprint.json, not pre-commit.
  # git push may strip PATH, so this hook is pre-commit only — the format
  # has already been applied by commit time, no need to re-run on push.
  - repo: local
    hooks:
      - id: dprint
        name: dprint fmt
        entry: dprint fmt
        language: system
        types_or: [markdown, json]
        files: '\.(md|json|jsonc)$'
        pass_filenames: true
        stages: [pre-commit]

  # --- Table of contents ---
  #
  # md-toc updates the TOC block delimited by `<!--TOC-->` markers in
  # any markdown file. Files without the marker are left untouched.
  #
  # The spec-driven-docs worked example is excluded because it ships its own
  # md-toc hook at depth 3, which stops at the requirement heading and leaves
  # the scenarios out. Two hooks with different depths over one file rewrite it
  # in turn, forever.
  - repo: https://github.com/frnmst/md-toc
    rev: 9.0.0
    hooks:
      - id: md-toc
        # -c: don't gate on TOC list coherence (free-form notes may diverge).
        # -p: write in place. --skip-lines 1: don't TOC the H1 title.
        args: [-p, -c, --skip-lines, '1', github]
        exclude: '^programming/spec-driven-docs/worked-example/'

  # --- Markdown lint (style gate + ordered-list renumber autofix) ---
  #
  # markdownlint-cli2 runs AFTER dprint. dprint owns all formatting; markdownlint
  # flags issues dprint can't normalize (semantic style, link integrity, heading
  # hierarchy) AND autofixes the one thing dprint can't do — ordered-list
  # renumbering (MD029, 1.→2.→3.). Fix-mode is enabled via "fix": true in the
  # config and isolated to MD029 (all other fixable rules disabled there) so it
  # never fights dprint. Configure rules via the sibling
  # `./.markdownlint-cli2.jsonc` at the repo root — without it, defaults (line
  # length, inline HTML) will be too strict for a knowledge base.
  #
  # Uses the node variant; swap to `markdownlint-cli2-docker` if your
  # CI doesn't have node available.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        additional_dependencies: ['markdownlint-rule-relative-links']

      # The story heading shape, gated by MD043 through its own config, because
      # the rule takes one `headings` array. The precondition is that
      # `.markdownlint-cli2.jsonc` never mentions MD043 at any value including
      # false: it is merged over this file and would silently disable the
      # contract. There is no epic config: `_docs/plan/epics/` holds no file, and
      # `check-hooks-apply` errors on a pattern that matches nothing.
      - id: markdownlint-cli2
        alias: md-story
        name: markdownlint (story heading shape)
        additional_dependencies: ['markdownlint-rule-relative-links']
        files: '^_docs/plan/stories/[^/]+\.md$'
        args: ['--config', '.markdownlint/story.markdownlint-cli2.jsonc']

  # --- Explicit relative links (ambiguity guard; pre-commit, local) ---
  #
  # A bare-filename relative link like [x](runbook.md) is ambiguous: the same
  # basename can exist in many directories, so neither humans nor tools (e.g. the
  # Marksman LSP) can tell which file is meant, and the link silently rots when a
  # file moves. Require an explicit prefix: ./name, ../dir/name, or a multi-segment
  # path dir/name. Fragment-only (#...), root-absolute (/...), and URL links pass.
  # Both forms are covered: inline links [x](target) and reference-style link
  # definitions [label]: target (footnote/collapsed refs included).
  #
  # pygrep is built into pre-commit — no external dependency, no companion file.
  - repo: local
    hooks:
      - id: no-bare-relative-links
        name: inline markdown links must be explicit (./, ../, or a path)
        language: pygrep
        types: [markdown]
        entry: '\]\((?!https?://|ftp://|mailto:|tel:|/|#|\.\.?/)[^)/\s:]+\.[A-Za-z0-9]+(?:#[^)]*)?\)'
      - id: no-bare-relative-link-defs
        name: markdown link definitions must be explicit (./, ../, or a path)
        language: pygrep
        types: [markdown]
        entry: '^\s*\[[^\]]+\]:\s+(?!https?://|ftp://|mailto:|tel:|/|#|\.\.?/|<)[^\s/:#]+\.[A-Za-z0-9]+'

  # --- No document indexes the filesystem (ADR-filesystem-owns-disk-state; pre-commit, local) ---
  #
  # The filesystem is the source of truth for what exists, so nothing enumerates
  # a directory because it has contents. The rule bars a shape, not a syntax: a
  # list, table, or full tree is fine wherever its entries carry their own
  # payload, and that judgment lives in
  # programming/spec-driven-docs/00-model.md — it cannot be linted.
  #
  # These two shapes can, because each is an index by construction:
  #   - a `source-files:` frontmatter key holding a digest's file list
  #   - a `Source Map` / `Source map` heading, which names the banned objective
  # A section that genuinely maps the tree gets a heading naming the knowledge it
  # carries — `## Directory domains`, saying what each part reserves — and passes.
  #
  # pygrep is built into pre-commit — no external dependency, no devShell entry.
  - repo: local
    hooks:
      - id: no-source-files-frontmatter
        name: no file-list frontmatter (the filesystem owns what exists)
        language: pygrep
        types: [markdown]
        entry: '^source-files:'
      - id: no-source-map-section
        name: no topic-to-filename source map section
        language: pygrep
        types: [markdown]
        entry: '(?i)^#{1,6}[ \t]+source[ \t]+map[ \t]*$'

  # --- Fixed-kind filenames carry a slug, not a counter
  #     (ADR-migrate-the-numbered-decision-log-to-slugs,
  #      ADR-a-known-issue-case-is-a-prefixed-slug; pre-commit, local) ---
  #
  # Both hooks are scoped to the directory rather than to the prefix. A `files:`
  # pattern of `^_docs/decisions/ADR-` never sees the file someone named
  # `0001-use-postgres.md`, so the one filename the rule exists to reject would
  # be the one filename the gate is blind to.
  #
  # The slug is the identifier because two branches each allocating the next
  # number are both right, and the merge leaves two records claiming one id.
  - repo: local
    hooks:
      - id: adr-filename-shape
        name: decision records are ADR-<slug>.md with no digit
        language: system
        files: '^_docs/decisions/.*\.md$'
        pass_filenames: true
        entry: >-
          sh -c 'for f; do case "$(basename "$f")" in
          TEMPLATE-adr.md) ;;
          ADR-*[0-9]*) echo "FAIL $f: a record filename carries no digit"; exit 1;;
          ADR-?*.md) ;;
          *) echo "FAIL $f: a record filename starts with ADR-"; exit 1;;
          esac; done' --

      - id: ki-filename-shape
        name: known-issue records are KI-<slug>.md with no counter
        language: system
        files: '^_docs/reference/known-issues/.*\.md$'
        pass_filenames: true
        entry: >-
          sh -c 'for f; do case "$(basename "$f")" in
          KI-[0-9]*) echo "FAIL $f: a case id is a slug, not a counter"; exit 1;;
          KI-?*.md) ;;
          *) echo "FAIL $f: a known-issue filename starts with KI-"; exit 1;;
          esac; done' --

  # --- Size budgets (programming/spec-driven-docs/06-format.md; pre-commit, local) ---
  #
  # Every budget the method states as a count is gated here. A budget nothing
  # checks is advice, and the shelf that publishes these numbers has to run them
  # against itself before a reader is asked to.
  #
  # Each set is asserted non-empty before it is measured. A check whose file set
  # is empty exits zero, so a renamed directory or a drifted pattern would turn
  # the gate into a green light over nothing.
  #
  # The two budgets the method states in words rather than counts — a
  # requirement statement is one sentence, and a reference is one level from the
  # entry document — are reviewer judgment and are declared unenforced in
  # 08-gates.md rather than faked here.
  - repo: local
    hooks:
      - id: adr-word-cap
        name: decision records stay within 350 words
        language: system
        always_run: true
        pass_filenames: false
        entry: >-
          sh -c 'set -- _docs/decisions/ADR-?*.md;
          [ -e "$1" ] || { echo "FAIL no decision records matched; the layout moved"; exit 1; };
          bad=""; for f; do w=$(wc -w < "$f");
          [ "$w" -le 350 ] || bad="$bad $f ($w words);"; done;
          [ -z "$bad" ] || { echo "FAIL 350-word budget:$bad"; exit 1; }'

      - id: agents-digest-size
        name: author-instructions files stay within 100 lines at the root and 150 in a subtree
        language: system
        always_run: true
        pass_filenames: false
        entry: >-
          sh -c '[ -f AGENTS.md ] || { echo "FAIL no root AGENTS.md"; exit 1; };
          bad=$(find . \( -path ./.git -o -path ./.draft \) -prune -o -name AGENTS.md -print |
          while read -r f; do n=$(wc -l < "$f"); c=150;
          [ "$f" = "./AGENTS.md" ] && c=100;
          [ "$n" -le "$c" ] || echo "$f ($n lines, cap $c)"; done);
          [ -z "$bad" ] || { echo "FAIL author-instructions budget"; echo "$bad"; exit 1; }'

      # The debt list holds the chapters written before this budget bound them.
      # A listed path is skipped; every other chapter in the same shelf is still
      # gated, so the shelves carrying debt cannot grow more of it. The list is
      # self-shrinking: a listed file that now fits, or that no longer exists,
      # fails this hook until its line is deleted. The cap is never raised to
      # admit a document — a chapter that wants more room splits.
      - id: chapter-size-cap
        name: chapters stay within 200 lines and catalogs within 300
        language: system
        always_run: true
        pass_filenames: false
        entry: >-
          sh -c 'debt="
          ./infra/sandbox-isolation-backends/00-threat-model-and-principles.md
          ./infra/sandbox-isolation-backends/10-runtimes-catalog.md
          ./infra/sandbox-isolation-backends/20-decision-libkrun-linux.md
          ./infra/sandbox-isolation-backends/30-libkrun-vs-firecracker.md
          ./infra/sandbox-isolation-backends/60-podman-libkrun-operational-notes.md
          ./languages/bash/release-workflow-spec/05-obs-multi-distro.md
          ./languages/rust/cli-spec/02-subcommand-pattern.md
          ./languages/rust/cli-spec/03-error-handling.md
          ./languages/rust/cli-spec/07-dependencies.md
          ./languages/rust/cli-spec/08-naming-and-visibility.md
          ./languages/rust/cli-spec/10-reference-projects.md
          ./languages/rust/release-workflow-spec/00-branch-model-and-release-plz.md
          ./programming/cli-design/00-architecture.md
          ./programming/cli-design/01-logging-and-output.md
          ./programming/cli-design/02-error-messages.md
          ./programming/cli-design/03-config-precedence.md
          ./programming/cli-design/04-coding-style-rust-zig.md
          ./programming/cli-design/05-designing-for-llm-agents.md
          ./programming/cli-design/08-naming-and-docs.md
          ./programming/cli-design/10-reference-projects.md
          ./programming/cli-design/12-config-generation-from-types.md
          ./programming/cli-design/13-terminal-output-toolbox.md
          ./tools/nix/02-per-project-devshell.md
          ./tools/osc-obs/case-studies/01-broken-link-drift-after-patch-rename.md
          ./tools/osc-obs/case-studies/02-libexpat-abi-override-via-sles-update-branch.md
          ";
          stale=""; for f in $debt; do
          [ -f "$f" ] || { stale="$stale $f (deleted);"; continue; };
          n=$(wc -l < "$f"); c=200;
          case "$f" in *-gates.md | *-checklist.md | */glossary.md) c=300;; esac;
          [ "$n" -gt "$c" ] || stale="$stale $f ($n lines, now fits);"; done;
          [ -z "$stale" ] || { echo "FAIL delist from the chapter debt list:$stale"; exit 1; };
          set -- $(find . -regextype posix-extended \( -path ./.git -o -path ./.draft \) -prune -o
          -regex ".*/([0-9][0-9]-[^/]*|glossary)\.md" -print);
          [ "$#" -gt 0 ] || { echo "FAIL no chapters matched; the layout moved"; exit 1; };
          bad=""; for f; do case "$debt" in *" $f "*) continue;; esac;
          n=$(wc -l < "$f"); c=200;
          case "$f" in *-gates.md | *-checklist.md | */glossary.md) c=300;; esac;
          [ "$n" -le "$c" ] || bad="$bad $f ($n lines, cap $c);"; done;
          [ -z "$bad" ] || { echo "FAIL chapter budget:$bad"; exit 1; }'

      # The gate that keeps the other gates honest. A budget can be stated in
      # AGENTS.md, restated in a chapter, and enforced by nothing; this names the
      # hook each count-shaped budget is enforced by, so renaming or deleting one
      # fails here instead of quietly turning a rule back into a suggestion. The
      # `$` anchor is load-bearing: without it a hook renamed by suffix still
      # matches the id it replaced.
      - id: budget-gates-exist
        name: every size budget names the hook that enforces it
        language: system
        always_run: true
        pass_filenames: false
        entry: >-
          sh -c 'for h in adr-word-cap agents-digest-size chapter-size-cap; do
          grep -q "id: $h$" .pre-commit-config.yaml ||
          { echo "FAIL no hook enforces a stated budget: $h"; exit 1; }; done'

  # --- Spelling (report-only) ---
  #
  # `language: system` because upstream ships this hook as `language: python`
  # whose wheel carries a prebuilt binary needing /lib64/ld-linux-x86-64.so.2 —
  # absent on a Nix host, so it installs fine and dies at exec. flake.nix
  # supplies a store-linked typos instead; the `rev:` now pins hook metadata
  # only, and the binary version tracks flake.lock independently.
  - repo: https://github.com/crate-ci/typos
    rev: v1.47.2
    hooks:
      # Report-only: typos auto-fix silently rewrites deliberate identifiers /
      # error-kind strings and can break code when these hooks are layered into
      # a code repo. Fix real typos by hand; allowlist in _typos.toml.
      #
      # The args override is load-bearing, not decoration: upstream's defaults
      # are [--write-changes, --force-exclude], so a bare `- id: typos` autofixes
      # and contradicts the policy above. --force-exclude is restated so
      # `exclude:` keeps applying to explicitly-passed filenames.
      - id: typos
        language: system
        args: [--force-exclude]

  # --- Secrets (fast, local) ---
  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets

  # --- Link checker (pre-push only; network) ---
  #
  # Runs only on `git push` so commits stay snappy. The cache file
  # `.lycheecache` should be gitignored. All tunables (concurrency, retries,
  # accept/exclude rules) live in the sibling `lychee.toml` at the repo root.
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee
        stages: [pre-push]
        # Knowledge base is markdown — don't crawl template/config files.
        types: [markdown]
        # Args intentionally minimal so lychee.toml owns the behavior.
        args:
          - --no-progress

  # --- Commit message: Conventional Commits (single SoT -> committed.toml) ---
  #
  # `language: system` for the same reason as typos above — the upstream hook is
  # `language: python` over a prebuilt binary wheel that cannot exec on a Nix
  # host. flake.nix supplies it. The entry and args (--fixup --wip
  # --commit-file) still come from the upstream hook definition; only the
  # environment changes.
  - repo: https://github.com/crate-ci/committed
    rev: v1.1.11
    hooks:
      - id: committed
        language: system
        stages: [commit-msg]
  # commitizen is intentionally NOT the commit-msg linter (committed is the SoT).
  # For version bumping / changelog only, add commitizen explicitly per-project.

  # --- The plan record this repository keeps
  #     (ADR-executable-artifacts-in-the-library,
  #      superseded in part by ADR-the-planning-method-moves-to-plan-xp) ---
  #
  # The method and the linter are plan-xp, pinned in flake.nix. Nothing here is a
  # copy of its schemas: a copy is the duplication AGENTS.md forbids, and a copy
  # that drifts from the version the gate runs is worse than none. The devShell
  # exports PLAN_XP_SCHEMA_DIR from the locked package, and every hook below
  # resolves through it.
  #
  # `language: system` throughout, as for dprint, typos and committed above.
  - repo: local
    hooks:
      # pass_filenames: false — a schema change invalidates every lane file, not
      # only the staged ones, so the hook names the full record itself.
      - id: plan-lane-files
        name: plan lane files match the schema
        entry: >-
          sh -c '[ -n "$PLAN_XP_SCHEMA_DIR" ] || {
          echo "PLAN_XP_SCHEMA_DIR is unset: enter the devShell first" >&2;
          echo "  nix develop --command git commit ..." >&2; exit 1; };
          check-jsonschema --schemafile
          "$PLAN_XP_SCHEMA_DIR/plan-lane.schema.json"
          _docs/plan/lanes/backlog.yml _docs/plan/lanes/todo.yml
          _docs/plan/lanes/doing.yml _docs/plan/lanes/review.yml
          _docs/plan/lanes/closed.yml'
        language: system
        files: '^_docs/plan/lanes/.*\.yml$'
        pass_filenames: false

      - id: plan-config-file
        name: plan config matches the schema
        entry: >-
          sh -c '[ -n "$PLAN_XP_SCHEMA_DIR" ] || {
          echo "PLAN_XP_SCHEMA_DIR is unset: enter the devShell first" >&2;
          echo "  nix develop --command git commit ..." >&2; exit 1; };
          check-jsonschema --schemafile
          "$PLAN_XP_SCHEMA_DIR/plan-config.schema.json" _docs/plan/config.yml'
        language: system
        files: '^_docs/plan/config\.yml$'
        pass_filenames: false

      # pass_filenames: false — every rule the linter has is cross-file, so
      # handing it one changed path would let a story rename slip through
      # whenever the lane file happened not to be staged. The hook stays
      # read-only: --rank-fix is run by a close ceremony, never by a gate.
      - id: plan-record-coherent
        name: the plan record is coherent
        entry: >-
          sh -c 'command -v check-plan >/dev/null || {
          echo "check-plan not on PATH: it comes from the pinned plan-xp input," >&2;
          echo "so enter the devShell first — nix develop --command git commit ..." >&2;
          exit 1; }; check-plan _docs/plan'
        language: system
        files: '^_docs/plan/'
        pass_filenames: false

  # --- The worked example shipped with programming/spec-driven-docs/ ---
  #
  # That shelf ships a pre-commit block, two MD043 arrays and a set of fixture
  # documents a reader copies into their own project, which
  # ADR-executable-artifacts-in-the-library makes an
  # artifact this repository runs rather than asserts. `just test-spec-shelf`
  # runs the block the way a reader would: over a scratch copy whose root is the
  # example's own root, so the `^_docs/` patterns inside it need no rewriting.
  #
  # pass_filenames: false — the recipe names the tree itself, and the block's
  # cross-file checks (rule-id uniqueness, table-of-contents freshness) would let
  # a break through whenever the file that broke it happened not to be staged.
  - repo: local
    hooks:
      - id: spec-shelf-example
        name: the spec-driven-docs example passes its own hooks
        entry: just test-spec-shelf
        language: system
        files: '^programming/spec-driven-docs/worked-example/'
        pass_filenames: false

  # --- Meta: keep the config itself honest ---
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
