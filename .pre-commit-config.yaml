# Pre-commit hooks for Markdown knowledge bases / docs repos.
#
# Mostly markdown, but not only: a bucket may ship an artifact a reader is
# expected to copy and run, and ADR-executable-artifacts-in-the-library requires
# such an artifact to be gated rather than asserted. That gate lives at the end
# of this file.
#
# Design goals:
#   - Autofix where possible; gate where not. Sane defaults, not bureaucratic.
#   - Stable canonical markdown (small diffs, predictable LLM tokens).
#   - Per-stage budget:
#       pre-commit  : fast, local, deterministic.
#       pre-push    : slower, network-aware (link check, flake evaluation).
#       commit-msg  : Conventional Commits shape.
#     The two stages together run every check, each check in one stage, and
#     CI only mirrors them (`project-platform:the-hooks-are-the-only-gate`).
#     The push stage does not rerun the commit stage.
#   - Generated files follow their generator. Every hook that rewrites or
#     judges excludes them, in the tool's own configuration where it has one,
#     and the reading hooks keep them (`project-platform:hooks-exclude-generated-files`):
#       flake.lock                        nix
#       .spec-driven-docs/manifest.json   sdd
#       .release-kit/manifest.json        rk
#       _docs/.markdownlint-cli2.jsonc    sdd
#       Cargo.lock                        cargo
#       CHANGELOG.md                      release-plz
#       .github/workflows/release-plz.yml rk
#       .github/workflows/pr-commits.yml  rk
#       .github/workflows/release.yml     cargo-dist
#     Each Markdown form or wording gate below also skips CHANGELOG.md, and
#     the two wording scripts leave it out of their git grep. The file does
#     not exist before the first release, and check-useless-excludes refuses
#     an exclude that matches nothing, so a hook with no other exclude skips
#     it through `files:`.
#     The specs, templates, and schema sdd ships stay byte-equal to the copy
#     `sdd spec` and the landing print, so the formatters skip them too: md-toc
#     through its exclude, and dprint through dprint.json.
#
# Tool provisioning (`project-platform:the-most-specific-native-owner-holds-each-dependency`):
#   The host supplies the hook runner, prek, and `minimum_prek_version` below
#   names the oldest one this file accepts. A hook takes the environment that
#   prek builds from its pinned `rev`. A hook that keeps `language: system`
#   carries an `# owner:` comment directly above it with its owner, class, and
#   reason. Its tool resolves off the ambient PATH, so enter the shell
#   (`direnv allow`, or `nix develop --command ...` when non-interactive)
#   before running it. prek builds the rust hook with the cargo of the
#   devShell toolchain and the python hooks with the uv of the host, and the
#   devShell supplies nodejs for the node hooks
#   (https://prek.j178.dev/reference/language-support/).
#
# Tooling stack (and what each owns):
#   - pre-commit-hooks : whitespace, line endings, basic safety.
#   - editorconfig-ec  : honor .editorconfig.
#   - dprint           : canonical CommonMark/GFM formatter (autofix).
#                        Devshell binary; config in `./dprint.json`.
#   - md-toc           : keep `<!--TOC-->` blocks in sync (autofix).
#   - markdownlint-cli2: style gate beyond what dprint enforces, plus the one
#                        autofix dprint can't do — ordered-list renumbering
#                        (MD029). dprint owns all other formatting. The hook
#                        lives in the managed block; the rules are this repo's.
#   - typos            : conservative spell check (report-only; SoT: _typos.toml).
#   - ripsecrets       : secret scanner (fast).
#   - lychee           : link checker (pre-push only; network).
#   - no-bare-relative-links : forbid bare-filename relative links (explicit ./ or path).
#   - shipped-scripts  : shellcheck + shfmt over the shell scripts the buckets
#                        ship (SoT for the layout: .editorconfig).
#   - committed        : Conventional Commits shape on commit-msg (SoT: committed.toml).
#
# First-run note:
#   dprint will rewrite every .md file once. Run
#     `prek run --all-files`
#   and commit the result as a single "chore: dprint baseline" commit
#   before turning hooks loose on normal work.

# The oldest prek that runs this file; an older one stops with an error
# (https://prek.j178.dev/reference/configuration/).
minimum_prek_version: "0.5.7"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
# The node hooks run on the devShell nodejs. Under `system`, prek takes a node
# that it finds and downloads none
# (https://prek.j178.dev/reference/language-support/), and a clean-machine
# run on 2026-11-11 with prek 0.5.7 took the devShell nodejs.
default_language_version:
  node: system
# A hook with no `stages:` runs at commit only. A remote hook whose manifest
# declares its own `stages:` ignores this line, so each such hook below carries
# an explicit `stages: [pre-commit]` (pre-commit-hooks v6.0.0 and typos declare
# pre-push too).
default_stages: [pre-commit]

repos:
# BEGIN release-kit
# The release convention's hooks. Install every stage they run at, with
# the hook runner on PATH, prek or pre-commit, which take the same flags:
# prek install --hook-type pre-commit --hook-type commit-msg --hook-type pre-push
# A CI sweep needs no SKIP here: no hook in this block refuses a trunk
# checkout. Set one where this project classifies a check of its own
# local-only, naming that hook's id.
# rk integrate runs this project's pre-integrate suite as
# `prek run --hook-stage manual --all-files`, or as `pre-commit run` with
# the same arguments where prek is not on PATH. Assign to the manual
# stage every check that must pass before work reaches the trunk, and have
# continuous integration invoke the same stages: a check that runs on one
# side of the boundary alone guards one side alone.
  - repo: local
    hooks:
      - id: rk-no-hand-authored-tag
        name: rk no hand-authored tag
        stages: [pre-push]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c 'case "$PRE_COMMIT_REMOTE_BRANCH" in refs/tags/v*) echo "never author a tag; the release automation mints every v* tag" >&2; exit 1;; esac'
      - id: rk-status-check
        name: rk status check
        language: system
        pass_filenames: false
        entry: rk status --check --target .
        files: '^(\.github/workflows/|\.gitlab-ci\.yml$|\.gitlab/ci/|AGENTS\.md$|\.release-kit/|\.pre-commit-config\.yaml$|release-plz\.toml$|dist-workspace\.toml$|release-please-config\.json$|cliff\.toml$|\.release-please-manifest\.json$|VERSION$)'
# END release-kit
  # --- Housekeeping (auto-fix where possible) ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The three fixers rewrite, so they skip the generated files listed in
      # the header. They have no configuration of their own.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]   # keep two-space hard breaks
        stages: [pre-commit]
        exclude: '^(flake\.lock|\.spec-driven-docs/manifest\.json|\.release-kit/manifest\.json|_docs/\.markdownlint-cli2\.jsonc|Cargo\.lock|CHANGELOG\.md|\.github/workflows/(release-plz|pr-commits|release)\.yml)$'
      - id: end-of-file-fixer
        stages: [pre-commit]
        exclude: '^(flake\.lock|\.spec-driven-docs/manifest\.json|\.release-kit/manifest\.json|_docs/\.markdownlint-cli2\.jsonc|Cargo\.lock|CHANGELOG\.md|\.github/workflows/(release-plz|pr-commits|release)\.yml)$'
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '^(flake\.lock|\.spec-driven-docs/manifest\.json|\.release-kit/manifest\.json|_docs/\.markdownlint-cli2\.jsonc|Cargo\.lock|CHANGELOG\.md|\.github/workflows/(release-plz|pr-commits|release)\.yml)$'
      - id: check-added-large-files
        args: ['--maxkb=16384']
        stages: [pre-commit]
      - id: check-case-conflict
      - id: check-merge-conflict
        args: ['--assume-in-merge']
      - id: destroyed-symlinks
        stages: [pre-commit]
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key

  # --- JSON/JSONC syntax gate ---
  #
  # check-json5 parses JSON that is valid JSON5 — comments and trailing commas
  # included — so it won't false-fail on the .jsonc / commented .json config a
  # docs repo carries (e.g. .markdownlint-cli2.jsonc, dprint.json). It is the
  # syntax gate only; canonical formatting/autofix is owned by the dprint json
  # plugin below. (The stock pretty-format-json hook is deliberately not used:
  # it rejects comments and can't format JSONC.)
  - repo: https://gitlab.com/bmares/check-json5
    rev: v1.0.1
    hooks:
      - id: check-json5

  # --- EditorConfig ---
  #
  # Honors the shared .editorconfig baseline over every authored file,
  # markdown included: .editorconfig relaxes trailing whitespace and line
  # length for *.md, so ec checks only what dprint leaves to it. This hook is
  # the one editorconfig check; `just lint` runs it through pre-commit rather
  # than a second time beside it. `.editorconfig-checker.json` excludes the
  # generated files, so a run outside pre-commit skips them too.
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v3.7.0
    hooks:
      - id: editorconfig-checker
        alias: ec

  # --- Formatter: dprint (canonical Markdown + JSON/JSONC) ---
  #
  # dprint is the single source of truth for whitespace, list style,
  # emphasis, table padding, etc. Configure via the sibling `./dprint.json`
  # at the repo root. Plugin URLs/versions are pinned inside dprint.json
  # (markdown + json), so the hook covers .md, .json and .jsonc.
  #
  # The json plugin gives comment-safe JSONC autofix (comments + trailing
  # commas survive), which is why it replaces pretty-format-json here;
  # check-json5 above stays the pure syntax gate.
  #
  # The textWrap=maintain rationale, MD029 renumbering, fix-mode isolation, and
  # the SoT decision are documented in this project's markdown formatting
  # toolchain notes.
  #
  # dprint comes from the devShell. Its plugins are pinned through dprint.json,
  # which also excludes the generated JSON files. --allow-no-files keeps a
  # commit that touches only those files from failing on "No files found".
  # The format has already been applied by commit time, so the hook does not
  # run again on push.
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) upstream dprint publishes no pre-commit hook.
      - id: dprint
        name: dprint fmt
        entry: dprint fmt --allow-no-files
        language: system
        types_or: [markdown, json]
        files: '\.(md|json|jsonc)$'
        pass_filenames: true
        stages: [pre-commit]

  # --- Table of contents ---
  #
  # md-toc updates the TOC block delimited by `<!--TOC-->` markers in
  # any markdown file. Files without the marker are left untouched.
  #
  - repo: https://github.com/frnmst/md-toc
    rev: 9.0.0
    hooks:
      - id: md-toc
        # -c: don't gate on TOC list coherence (free-form notes may diverge).
        # -p: write in place. --skip-lines 1: don't TOC the H1 title.
        args: [-p, -c, --skip-lines, '1', github]
        exclude: '^(_docs/specs/SPEC-(budget-debt|comparison-docs|decision-records|docs-format|docs-foundations|docs-specs|guides|instance|known-issues|spec-to-code|tracking|writing-policy|writing-style)\.md|CHANGELOG\.md)$'

  # --- Markdown lint (style gate + ordered-list renumber autofix) ---
  #
  # markdownlint-cli2 runs from the managed block at the end of this file, so
  # it runs after dprint, which owns all formatting. Its rules live in the
  # root `./.markdownlint-cli2.jsonc`, which also loads the relative-links rule
  # the managed hook installs. `_docs/.markdownlint-cli2.jsonc`, which the
  # documentation canon manages, merges the spec and decision-record heading
  # shapes over it.

  # --- Explicit relative links (ambiguity guard; pre-commit, local) ---
  #
  # A bare-filename relative link like [x](runbook.md) is ambiguous: the same
  # basename can exist in many directories, so neither humans nor tools (e.g. the
  # Marksman LSP) can tell which file is meant, and the link silently rots when a
  # file moves. Require an explicit prefix: ./name, ../dir/name, or a multi-segment
  # path dir/name. Fragment-only (#...), root-absolute (/...), and URL links pass.
  # Both forms are covered: inline links [x](target) and reference-style link
  # definitions [label]: target (footnote/collapsed refs included).
  #
  # pygrep is built into the hook runner — no external dependency, no companion file.
  - repo: local
    hooks:
      - id: no-bare-relative-links
        name: inline markdown links must be explicit (./, ../, or a path)
        language: pygrep
        types: [markdown]
        entry: '\]\((?!https?://|ftp://|mailto:|tel:|/|#|\.\.?/)[^)/\s:]+\.[A-Za-z0-9]+(?:#[^)]*)?\)'
        # Skips release-plz's CHANGELOG.md, as the header says.
        files: '^(?!CHANGELOG\.md$)'
      - id: no-bare-relative-link-defs
        name: markdown link definitions must be explicit (./, ../, or a path)
        language: pygrep
        types: [markdown]
        entry: '^\s*\[[^\]]+\]:\s+(?!https?://|ftp://|mailto:|tel:|/|#|\.\.?/|<)[^\s/:#]+\.[A-Za-z0-9]+'
        # Skips release-plz's CHANGELOG.md, as the header says.
        files: '^(?!CHANGELOG\.md$)'

  # --- No document indexes the filesystem (ADR-filesystem-owns-disk-state; pre-commit, local) ---
  #
  # The filesystem is the source of truth for what exists, so nothing enumerates
  # a directory because it has contents. The rule bars a shape, not a syntax: a
  # list, table, or full tree is fine wherever its entries carry their own
  # payload, and that judgment lives in the local boundary spec — it cannot be
  # linted.
  #
  # These two shapes can, because each is an index by construction:
  #   - a `source-files:` frontmatter key holding a digest's file list
  #   - a `Source Map` / `Source map` heading, which names the banned objective
  # A section that genuinely maps the tree gets a heading naming the knowledge it
  # carries — `## Directory domains`, saying what each part reserves — and passes.
  #
  # pygrep is built into the hook runner — no external dependency, no devShell entry.
  - repo: local
    hooks:
      - id: no-source-files-frontmatter
        name: no file-list frontmatter (the filesystem owns what exists)
        language: pygrep
        types: [markdown]
        entry: '^source-files:'
        # Skips release-plz's CHANGELOG.md, as the header says.
        files: '^(?!CHANGELOG\.md$)'
      - id: no-source-map-section
        name: no topic-to-filename source map section
        language: pygrep
        types: [markdown]
        entry: '(?i)^#{1,6}[ \t]+source[ \t]+map[ \t]*$'
        # Skips release-plz's CHANGELOG.md, as the header says.
        files: '^(?!CHANGELOG\.md$)'


  # Instance policy: this retired name is specific to this knowledge base. The
  # payload verifies itself from the managed block, which carries that hook.
  - repo: local
    hooks:
      # owner: host (no-hook-language) a script of this repository that calls only git and grep.
      - id: no-named-method
        name: a retired method name does not return
        language: system
        always_run: true
        pass_filenames: false
        entry: .hooks/no-named-method.sh

  # Instance policy: a guide in this library is a recipe. The gate reads the
  # section shape a reader depends on; the judgment rules it cannot decide are
  # listed as unenforced in `_docs/specs/SPEC-guides.md`.
  - repo: local
    hooks:
      # owner: host (no-hook-language) a script of this repository that calls only awk.
      - id: guide-recipe-shape
        name: a guide is prerequisites then ordered steps
        language: system
        types: [markdown]
        entry: .hooks/guide-recipe-shape.sh
        # Skips release-plz's CHANGELOG.md, as the header says.
        files: '^(?!CHANGELOG\.md$)'

  # Instance policy: this repository is an instance of the documentation canon,
  # so every mention of it is an upstream dependency reference, declared once.
  - repo: local
    hooks:
      # owner: host (no-hook-language) a script of this repository that calls only git, grep, and sed.
      - id: canon-named-once
        name: the upstream canon is named in one place, unversioned
        language: system
        always_run: true
        pass_filenames: false
        entry: .hooks/canon-named-once.sh

  # Instance policy: a bucket may ship a shell script a reader copies and runs,
  # and `knowledge-base-boundary:a-shipped-script-is-gated` is what makes that
  # script checked rather than asserted. shellcheck and shfmt both come from the
  # devShell, which is why they are listed there.
  #
  # The gate discovers its own set from the index instead of taking the file
  # list pre-commit passes. A `files:` pattern here would be a second copy of
  # the bucket list, and the day a bucket is renamed the pattern matches nothing
  # and the gate reports success over an unchecked tree.
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) a script of this repository that calls the devShell shellcheck and shfmt.
      - id: shipped-scripts
        name: the shell scripts the buckets ship are clean
        language: system
        always_run: true
        pass_filenames: false
        entry: .hooks/shipped-scripts.sh

  # --- Spelling (report-only) ---
  #
  # The upstream hook, `language: python`: pre-commit builds it from the
  # pinned `rev`. Its wheel carries a prebuilt binary that links the standard
  # ELF loader, which the host supplies (nix-ld on a NixOS host).
  - repo: https://github.com/crate-ci/typos
    rev: v1.47.2
    hooks:
      # Report-only: typos auto-fix silently rewrites deliberate identifiers /
      # error-kind strings and can break code when these hooks are layered into
      # a code repo. Fix real typos by hand; allowlist in _typos.toml.
      #
      # The args override is load-bearing, not decoration: upstream's defaults
      # are [--write-changes, --force-exclude], so a bare `- id: typos` autofixes
      # and contradicts the policy above. --force-exclude is restated so
      # `exclude:` keeps applying to explicitly-passed filenames.
      #
      # The manifest declares pre-push too; the spell check is a commit-stage
      # check. `_typos.toml` excludes the generated files, and --force-exclude
      # applies that list to the files pre-commit passes.
      - id: typos
        args: [--force-exclude]
        stages: [pre-commit]

  # --- Secrets (fast, local) ---
  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets

  # --- Link checker (pre-push only; network) ---
  #
  # Runs only on `git push` so commits stay snappy. The cache file
  # `.lycheecache` should be gitignored. All tunables (concurrency, retries,
  # accept/exclude rules) live in the sibling `lychee.toml` at the repo root.
  #
  # `lychee-system` runs the lychee of the devShell, so the hook downloads
  # nothing and needs no version argument.
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      # owner: devshell (no-hook-language) upstream lychee offers only script, docker_image, and system ids.
      - id: lychee-system
        stages: [pre-push]
        # Knowledge base is markdown — don't crawl template/config files.
        types: [markdown]
        # Args intentionally minimal so lychee.toml owns the behavior.
        args: [--no-progress]

  # --- One supported system (pre-push; evaluates the flake) ---
  #
  # The check behind `just test-one-system`
  # (ADR-linux-is-the-only-supported-project-target). It evaluates the flake,
  # so it runs on push, and only when a file it reads changes.
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) a script of this repository that evaluates the flake with nix and jq.
      - id: one-system
        name: the flake exposes the one supported system
        entry: .hooks/check-one-system.sh
        language: system
        files: '^(flake\.(nix|lock)|\.hooks/(check-one-system\.sh|one-system\.nix))$'
        pass_filenames: false
        stages: [pre-push]

  # --- Commit message: Conventional Commits (single SoT -> committed.toml) ---
  #
  # The upstream hook, `language: python`, with its entry, its args
  # (--fixup --wip --commit-file), and its commit-msg stage.
  - repo: https://github.com/crate-ci/committed
    rev: v1.1.11
    hooks:
      - id: committed
        stages: [commit-msg]
  # commitizen is intentionally NOT the commit-msg linter (committed is the SoT).
  # For version bumping / changelog only, add commitizen explicitly per-project.

  # --- The gates this repository adds, exercised against violations ---
  #
  # A new gate is demonstrated failing before it is trusted
  # (ADR-executable-artifacts-in-the-library), and the failures worth catching
  # are the quiet ones: a matcher whose exit code is inverted, or an MD043 array
  # that lost `match_case` and now accepts a heading in the wrong case. Both
  # report success.
  #
  # Scoped to the files that define a gate or wire one, so an ordinary content
  # commit does not pay for it. This config is in that set: a gate body moved
  # from a script into an inline `entry:` would otherwise change what runs
  # without running the control that proves it still refuses anything. The
  # vendored payload is included because a managed-gate edit must exercise its
  # deliberate failure case.
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) the just recipe of this repository that runs .hooks/test-gates.sh.
      - id: gate-negative-controls
        name: every gate fails when it should
        entry: just test-gates
        language: system
        files: '^(\.hooks/|\.markdownlint/|\.spec-driven-docs/|\.pre-commit-config\.yaml$|\.pre-commit-hooks\.yaml$|justfile$)'
        pass_filenames: false

  # --- A flake holds no language library (pre-commit, pygrep) ---
  #
  # A Python, Node, or Perl package belongs to the manifest of its stack
  # (`project-platform:the-most-specific-native-owner-holds-each-dependency`).
  - repo: local
    hooks:
      - id: no-language-library-in-flake
        name: a flake holds no language library
        language: pygrep
        entry: '^(?!\s*#).*(withPackages|python3[0-9]*Packages\.|pythonPackages\.|nodePackages\.|perlPackages\.)'
        files: '(^|/)flake\.nix$|(^|/)nix/.*\.nix$'

  # --- A flake reference reads the git tree (pre-commit, pygrep) ---
  #
  # The local twin of the hook that .pre-commit-hooks.yaml publishes
  # (`project-platform:a-flake-is-read-from-its-git-tree`). A `path:` reference
  # or a bare-path `getFlake` copies the whole working tree into the store,
  # ignored files included. A legitimate line carries `nix-path-ok: <reason>`.
  # The must-fail corpus holds the intended hits. .hooks/test-gates.sh holds
  # the two entries equal and runs the published hook over the corpus.
  - repo: local
    hooks:
      - id: no-path-flake-reference
        name: a flake reference reads the git tree, not a path copy
        language: pygrep
        types: [text]
        entry: '^(?!.*nix-path-ok).*(\bgetFlake\s*+(?:\(\s*+(?!\\?["''](?:git\+file:|/nix/store/))|\\?["''](?!git\+file:|/nix/store/))|(?<![\w-])path:(?!/nix/store/)[^\s`''"),\]:?\\0-9-])'  # nix-path-ok: the hook's own expression
        exclude: '^(\.hooks/flake-reference-corpus/must-fail\.txt|CHANGELOG\.md)$'

  # --- A flake holds no git hook runner (pre-commit, pygrep) ---
  #
  # The local twin of the hook that .pre-commit-hooks.yaml publishes
  # (`project-platform:the-host-supplies-the-hook-runner`). The host supplies
  # the runner, so a devshell that lists it, as a `pkgs.` attribute (quoted or
  # not), as a bare item of a `with pkgs;` list, inside a `${ }` interpolation,
  # or on a line of its own, fails. The entry reads a line outside its "..."
  # strings, so a string that only names the runner passes, and it reads past
  # an interpolation that names no runner. It reads one line at a time, so it
  # cannot tell a line inside a '' ... '' string, and an interpolation that
  # holds a nested } ends at that brace. A flake that
  # installs the runner on a host marks that line `hook-runner-ok: <reason>`.
  # .hooks/test-gates.sh holds the two entries equal and runs the published
  # hook over fixtures that it builds at run time.
  - repo: local
    hooks:
      - id: no-hook-runner-in-flake
        name: a flake holds no git hook runner
        language: pygrep
        files: '(^|/)flake\.nix$|(^|/)nix/.*\.nix$'
        entry: '^(?!\s*#)(?!.*hook-runner-ok)(?:\s*(?:pre-commit|prek)\s*(?:#.*)?$|(?:[^"#]|"(?:[^"\\$]|\\.|\$(?!\{)|\$\{(?:(?!\bpkgs\.(?:"(?:pre-commit|prek)"|(?:pre-commit|prek)(?![\w-])))[^}])*\})*")*?(?:\bpkgs\.(?:"(?:pre-commit|prek)"|(?:pre-commit|prek)(?![\w-]))|"(?:[^"\\$]|\\.|\$(?!\{)|\$\{(?:(?!\bpkgs\.(?:"(?:pre-commit|prek)"|(?:pre-commit|prek)(?![\w-])))[^}])*\})*\$\{[^}]*?\bpkgs\.(?:"(?:pre-commit|prek)"|(?:pre-commit|prek)(?![\w-]))|\bwith\s+pkgs\s*;(?:[^"#]|"(?:[^"\\$]|\\.|\$(?!\{)|\$\{(?:(?!\bpkgs\.(?:"(?:pre-commit|prek)"|(?:pre-commit|prek)(?![\w-])))[^}])*\})*")*?[\[\s](?:pre-commit|prek)(?=[\s\]])))'

  # --- host-requirements.toml parses (system) ---
  #
  # The local twin of the hook that .pre-commit-hooks.yaml publishes
  # (`project-platform:host-requirements-list-the-host-tools`). The typed parser
  # of `exobrain host-check` is the validation of the format, and the hook runs
  # only when the file changes. .hooks/test-gates.sh holds the two entries equal
  # and runs the published hook over a malformed file and a valid one.
  - repo: local
    hooks:
      # owner: devshell (project-environment) exobrain is the program that this repository builds into target/debug, which .envrc puts on PATH.
      - id: host-requirements
        name: host-requirements.toml parses
        language: system
        entry: exobrain host-check --parse-only
        pass_filenames: false
        files: '^host-requirements\.toml$'

  # --- The Rust workspace in crates/ ---
  #
  # The fast checks run at commit on the Rust and Cargo files. The costly
  # checks run at push, so a push that passed its hooks passes the test job of
  # CI. The release build of cargo-dist runs in CI only.
  - repo: local
    hooks:
      # owner: devshell (project-environment) cargo fmt is part of the Rust toolchain that the devshell pins.
      - id: cargo-fmt
        name: cargo fmt check
        entry: cargo fmt --check
        language: system
        files: '(\.rs|(^|/)Cargo\.(toml|lock)|^rust-toolchain\.toml)$'
        pass_filenames: false
      # owner: devshell (project-environment) cargo clippy is part of the Rust toolchain and builds the crate.
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        files: '(\.rs|(^|/)Cargo\.(toml|lock)|^(rust-toolchain|clippy)\.toml)$'
        pass_filenames: false
      # owner: devshell (project-environment) cargo nextest runs the test suite of the crate.
      - id: cargo-nextest
        name: cargo nextest
        entry: cargo nextest run
        language: system
        files: '(\.rs|(^|/)Cargo\.(toml|lock)|^rust-toolchain\.toml|^\.config/nextest\.toml)$'
        pass_filenames: false
        stages: [pre-push]
      # owner: devshell (project-environment) cargo deny is a cargo subcommand that reads the lock file of the workspace.
      - id: cargo-deny
        name: cargo deny
        entry: cargo deny check
        language: system
        files: '((^|/)Cargo\.(toml|lock)|^deny\.toml)$'
        pass_filenames: false
        stages: [pre-push]
      # owner: host (no-hook-language) nix comes from the host and has no hook in a language that pre-commit builds.
      - id: nix-flake-check
        name: nix flake check
        entry: nix flake check
        language: system
        files: '(\.rs|(^|/)Cargo\.(toml|lock)|^rust-toolchain\.toml|^flake\.(nix|lock)|^nix/)'
        pass_filenames: false
        stages: [pre-push]
      # The release workflow that cargo-dist renders matches its configuration,
      # and the release plans the binary. The forge never runs a dist plan on a
      # pull request (`pr-run-mode = "skip"`), so this hook holds that proof.
      # owner: devshell (no-hook-language) cargo-dist publishes no pre-commit hook.
      - id: dist-plan
        name: cargo-dist plan and generated workflow
        entry: sh -c 'dist plan > /dev/null && dist generate --check'
        language: system
        files: '(^dist-workspace\.toml|^\.github/workflows/release\.yml|(^|/)Cargo\.toml)$'
        pass_filenames: false
        stages: [pre-push]

  # --- Meta: keep the config itself honest ---
  - repo: meta
    hooks:
      # `check-hooks-apply` is deliberately absent. The managed block wires the
      # whole delivered gate set, including the comparison gates, and this
      # knowledge base holds no `COMPARISON-<slug>.md` yet. Those gates matching
      # nothing is the expected state of a document kind not yet written, not a
      # misconfigured hook.
      - id: check-useless-excludes
