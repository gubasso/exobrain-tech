# The hooks of the project.
repos:
  - repo: https://github.com/gubasso/exobrain-tech
    rev: v1.1.0
    hooks:
      - id: hook-revisions
        args: [--set, common, --set, rust]
  # typos, with the project's own args
  - repo: https://github.com/crate-ci/typos
    rev: 'v1.40.0'  # pinned by hand
    hooks:
      - id: typos
        args: [--write-changes]
        stages: [pre-commit]
        files: '^src/'
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        exclude: '^fixtures/'
  - repo: https://github.com/example/unlisted
    rev: v0.0.1
    hooks:
      - id: unlisted

# BEGIN release-kit
  - repo: https://github.com/bnjbvr/cargo-machete
    rev: v0.9.0
    hooks:
      - id: cargo-machete
# END release-kit
  - repo: local
    hooks:
      - id: fmt
        name: fmt
        entry: cargo fmt
        language: system
