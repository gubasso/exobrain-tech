[package]
name = "exobrain"
version = "1.0.0"
description = "The exobrain-tech CLI: guards that enforce the rules of the knowledge base."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# The crate is the binary and its tests. Its fixtures stay in the
# repository and out of a package.
exclude = ["/tests"]

[[bin]]
name = "exobrain"
path = "src/main.rs"

[dependencies]
camino = { version = "1.2.5", features = ["serde1"] }
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
jiff = "0.2.35"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
toml = "1.2.1"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[lints]
workspace = true

# The crate is not published to a registry, which hides it from cargo-dist
# by default. The GitHub release still ships the binary.
[package.metadata.dist]
dist = true
