[profile.default]
status-level = "pass"
final-status-level = "fail"
success-output = "never"
failure-output = "immediate-final"

# The race test of the weekly prek gc prints why it skips a prek version
# outside the range that SPEC-cli.md states, so its output always shows.
[[profile.default.overrides]]
filter = "test(weekly_prek_gc_removes_the_clone_of_a_running_hook)"
success-output = "immediate"

[profile.ci]
fail-fast = false
status-level = "fail"
final-status-level = "fail"
success-output = "never"
failure-output = "immediate-final"

[profile.ci.retries]
backoff = "exponential"
count = 2
delay = "1s"

[[profile.ci.overrides]]
filter = "test(weekly_prek_gc_removes_the_clone_of_a_running_hook)"
success-output = "immediate"
