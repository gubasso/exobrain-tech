# The validation workflow. Every step runs one hook stage, so a push that
# passed its hooks passes here (project-platform:the-hooks-are-the-only-gate).
# Its name is the workflow whose completion wakes the release gate in
# release-plz.yml, and its job is the check that gate believes.
name: ci

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # It runs unless cancelled, so a job added later as a need cannot turn a
  # failure into a skip that the forge reads as success.
  test:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # The one-system hook reads the flake as a git+file reference without
      # ?shallow=1, which needs the whole history.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      # The commit stage first, then the costly checks of the push stage.
      - run: nix develop --command pre-commit run --all-files
      # lychee-system stays local: an outside site answers a CI runner with a
      # block or a timeout that it does not give a developer host.
      - run: nix develop --command pre-commit run --all-files --hook-stage pre-push
        env:
          SKIP: lychee-system
