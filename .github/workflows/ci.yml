# CI workflow — repeats the two hook stages in the project's Nix devshell.
# The commit stage and the push stage together run every check of this
# repository, so CI holds no check of its own and installs no tool outside
# the devshell (project-platform:hooks-run-every-ci-check). This repository
# names no CI-only check, report-only job, or scheduled job.
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Cache Nix store
        uses: DeterminateSystems/flakehub-cache-action@main
      - name: Commit stage
        run: nix develop --command pre-commit run --all-files --show-diff-on-failure

  pre-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Cache Nix store
        uses: DeterminateSystems/flakehub-cache-action@main
      # lychee-system is local-only: an external site answers a CI runner
      # with a block or a timeout that it does not give a developer host.
      - name: Push stage
        run: nix develop --command pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure
        env:
          SKIP: lychee-system
