# Additions for a project adopting spec-driven-docs.
#
# Merge these into .pre-commit-config.yaml. Paths assume a knowledge base
# (`_docs/`); change to `docs/` for a codebase. The two markdownlint entries
# reuse the id of the project's existing markdownlint hook so its language and
# dependency settings carry over.
#
# Precondition for the heading shapes: the project's .markdownlint-cli2.jsonc
# must not mention MD043 at any value, including false. That file is merged over
# the --config base and would silently disable both shapes while the hooks keep
# reporting success.

repos:
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        alias: md-spec
        name: markdownlint (spec heading shape)
        files: '^_docs/specs/SPEC-[a-z0-9-]+\.md$'
        args: ['--config', '.markdownlint/spec.markdownlint-cli2.jsonc']

      - id: markdownlint-cli2
        alias: md-adr
        name: markdownlint (decision record heading shape)
        files: '^_docs/decisions/(ADR-.*|TEMPLATE-adr)\.md$'
        args: ['--config', '.markdownlint/adr.markdownlint-cli2.jsonc']

  - repo: local
    hooks:
      # Scoped to the directory, not the prefix: a `files:` pattern of
      # `^_docs/decisions/ADR-` never sees the file someone named
      # `0001-use-postgres.md`, which is the one name the rule exists to reject.
      - id: adr-filename-shape
        name: decision records are ADR-<slug>.md with no digit
        language: system
        files: '^_docs/decisions/.*\.md$'
        pass_filenames: true
        entry: >-
          sh -c 'for f; do case "$(basename "$f")" in
          TEMPLATE-adr.md) ;;
          ADR-*[0-9]*) echo "FAIL docs-foundations:a-kind-prefix-carries-a-slug $f"; exit 1;;
          ADR-?*.md) ;;
          *) echo "FAIL docs-foundations:artifact-filenames-carry-a-kind-prefix $f"; exit 1;;
          esac; done' --

      - id: ki-filename-shape
        name: known-issue records are KI-<slug>.md with no counter
        language: system
        files: '^_docs/reference/known-issues/.*\.md$'
        pass_filenames: true
        entry: >-
          sh -c 'for f; do case "$(basename "$f")" in
          KI-[0-9]*) echo "FAIL docs-foundations:a-kind-prefix-carries-a-slug $f"; exit 1;;
          KI-?*.md) ;;
          *) echo "FAIL docs-foundations:artifact-filenames-carry-a-kind-prefix $f"; exit 1;;
          esac; done' --

      # One way only. A cited case with no record is a fabrication; a record no
      # suppression cites is ordinary, because the workaround may live in a
      # config or a dependency pin rather than in a marked test.
      #
      # `always_run` rather than a `files:` filter, because the commit that
      # breaks this check is the one that deletes the record while a suppression
      # still cites it — and pre-commit selects staged files with
      # `--diff-filter=ACMRTUXB`, which omits deletions. A filter would hand the
      # hook an empty list on exactly the commit it exists to catch.
      - id: case-id-resolves
        name: every case id cited in code resolves to a known-issue record
        language: system
        always_run: true
        pass_filenames: false
        entry: >-
          sh -c 'grep -rhoE "\bKI-[a-z0-9-]+" src tests | sort -u > /tmp/kc;
          ls _docs/reference/known-issues | sed "s/\.md$//" | sort -u > /tmp/kr;
          comm -13 /tmp/kr /tmp/kc | grep . &&
          { echo "FAIL spec-to-code:a-suppression-names-its-case"; exit 1; }; true'

      # Every size budget is gated, and every one of these hooks asserts its file
      # set is non-empty first: a check handed no files exits zero, so a renamed
      # directory would read as a pass. `always_run` for the same reason a
      # cross-set check needs it — a `files:` filter cannot see the rename.
      - id: adr-word-cap
        name: decision records stay within 350 words
        language: system
        always_run: true
        pass_filenames: false
        entry: >-
          sh -c 'set -- _docs/decisions/ADR-?*.md;
          [ -e "$1" ] || { echo "FAIL no decision records matched; the layout moved"; exit 1; };
          for f; do w=$(wc -w < "$f"); [ "$w" -le 350 ] ||
          { echo "FAIL decision-records:body-stays-within-350-words $f: $w words"; exit 1; }; done'

      - id: agents-digest-size
        name: author-instructions files stay within 100 lines at the root and 150 in a subtree
        language: system
        always_run: true
        pass_filenames: false
        entry: >-
          sh -c '[ -f AGENTS.md ] || { echo "FAIL no root AGENTS.md"; exit 1; };
          bad=$(find . -path ./.git -prune -o -name AGENTS.md -print |
          while read -r f; do n=$(wc -l < "$f"); c=150;
          [ "$f" = "./AGENTS.md" ] && c=100;
          [ "$n" -le "$c" ] || echo "$f ($n lines, cap $c)"; done);
          [ -z "$bad" ] || { echo "FAIL docs-format:author-instructions-stay-within-budget";
          echo "$bad"; exit 1; }'

      # Specs and decision records carry their own budgets, so the chapter cap
      # governs the prose zones only.
      - id: chapter-size-cap
        name: chapters stay within 200 lines
        language: system
        always_run: true
        pass_filenames: false
        entry: >-
          sh -c 'set -- $(find _docs -name "*.md" -not -path "_docs/specs/*"
          -not -path "_docs/decisions/*");
          [ "$#" -gt 0 ] || { echo "FAIL no chapters matched; the layout moved"; exit 1; };
          for f; do n=$(wc -l < "$f"); [ "$n" -le 200 ] ||
          { echo "FAIL docs-format:chapter-stays-within-200-lines $f: $n lines"; exit 1; }; done'

      # The gate that keeps the other gates honest. A budget can be stated in a
      # spec, restated in AGENTS.md, and enforced by nothing; this check names
      # the hook each count-shaped budget is enforced by, so deleting one fails
      # instead of quietly turning a rule back into a suggestion.
      - id: budget-gates-exist
        name: every size budget names the hook that enforces it
        language: system
        always_run: true
        pass_filenames: false
        entry: >-
          sh -c 'for h in adr-word-cap agents-digest-size spec-size-cap chapter-size-cap; do
          grep -q "id: $h$" pre-commit-additions.yaml ||
          { echo "FAIL docs-format:every-budget-carries-a-gate: no hook $h"; exit 1; }; done'

      - id: spec-requirement-parts
        name: every requirement carries an id and a verification
        language: system
        files: '^_docs/specs/SPEC-[a-z0-9-]+\.md$'
        pass_filenames: true
        entry: >-
          sh -c 'for f; do
          r=$(grep -cE "^### \`[a-z0-9-]+:[a-z0-9-]+\` . " "$f" || true);
          h=$(grep -c "^### " "$f" || true);
          v=$(grep -c "^Verify: " "$f" || true);
          [ "$r" = "$h" ] && [ "$r" = "$v" ] ||
          { echo "FAIL docs-specs:requirement-carries-five-parts $f: $r/$h headings, $v verify"; exit 1; };
          done' --

      - id: spec-rule-id-unique
        name: rule identifiers are unique across the project
        language: system
        files: '^_docs/specs/.*\.md$'
        pass_filenames: false
        entry: >-
          sh -c 'dupes=$(grep -rhoE "^### \`[a-z0-9-]+:[a-z0-9-]+\`" _docs/specs | sort | uniq -d);
          [ -z "$dupes" ] ||
          { echo "FAIL docs-specs:rule-id-is-unique-and-slugged"; echo "$dupes"; exit 1; }'

      - id: spec-prohibition-cap
        name: a spec carries at most five prohibitions
        language: system
        files: '^_docs/specs/SPEC-[a-z0-9-]+\.md$'
        pass_filenames: true
        entry: >-
          sh -c 'for f; do n=$(grep -cE "MUST NOT|SHALL NOT" "$f" || true); [ "$n" -le 5 ] ||
          { echo "FAIL docs-specs:prohibitions-are-capped $f: $n"; exit 1; }; done' --

      - id: spec-size-cap
        name: specs stay within 300 lines and carry a TOC above 100
        language: system
        always_run: true
        pass_filenames: false
        entry: >-
          sh -c 'set -- _docs/specs/SPEC-?*.md;
          [ -e "$1" ] || { echo "FAIL no specs matched; the layout moved"; exit 1; };
          for f; do n=$(sed "/^<!--TOC-->$/,/^<!--TOC-->$/d" "$f" | wc -l);
          [ "$n" -le 300 ] || { echo "FAIL $f: $n authored lines, cap is 300"; exit 1; };
          if [ "$n" -gt 100 ]; then grep -q "<!--TOC-->" "$f" ||
          { echo "FAIL $f: over 100 lines with no TOC"; exit 1; }; fi; done'

      - id: typed-clause-shape
        name: typed spec-change clauses carry a well-formed rule ID
        language: system
        files: '^_docs/plan/.*\.md$'
        pass_filenames: true
        entry: >-
          sh -c 'for f; do
          rg -n "ADDED|MODIFIED|REMOVED" "$f" |
          rg -v "(ADDED|MODIFIED|REMOVED) \x60[a-z0-9-]+:[a-z0-9-]+\x60" | grep . &&
          { echo "FAIL spec-to-code:a-spec-change-is-typed $f"; exit 1; };
          done; true' --

      - id: comment-names-no-record
        name: no comment names a decision record
        language: system
        files: '\.py$'
        pass_filenames: true
        entry: >-
          sh -c 'for f; do grep -nE "^[[:space:]]*#.*\bADR-" "$f" &&
          { echo "FAIL spec-to-code:a-comment-names-no-record $f"; exit 1; };
          done; true' --

      # The orphan check: a coverage tag naming a rule no spec defines is a
      # fabricated citation, and catching it is what makes the other citation
      # sites worth trusting. Scoped to the code, because a spec stating the
      # rule necessarily writes the words the tag is made of.
      - id: comment-rule-id-resolves
        name: every rule ID cited in code resolves to a requirement
        language: system
        always_run: true
        pass_filenames: false
        entry: >-
          sh -c 'grep -rhoE "(SATISFIES|VERIFIES) [a-z0-9-]+:[a-z0-9-]+" src tests |
          grep -oE "[a-z0-9-]+:[a-z0-9-]+" | sort -u > /tmp/cited;
          grep -rhoE "^### .[a-z0-9-]+:[a-z0-9-]+." _docs/specs |
          grep -oE "[a-z0-9-]+:[a-z0-9-]+" | sort -u > /tmp/agreed;
          comm -13 /tmp/agreed /tmp/cited | grep . &&
          { echo "FAIL spec-to-code:a-comment-cites-the-rule"; exit 1; }; true'

      - id: marker-cap-and-question
        name: clarification markers are capped at three and carry a question
        language: system
        files: '^_docs/specs/SPEC-[a-z0-9-]+\.md$'
        pass_filenames: true
        entry: >-
          sh -c 'for f; do n=$(grep -c "\[NEEDS CLARIFICATION" "$f" || true);
          [ "$n" -le 3 ] || { echo "FAIL docs-specs:markers-are-capped $f: $n"; exit 1; };
          grep -qE "\[NEEDS CLARIFICATION:?[[:space:]]*[]]" "$f" &&
          { echo "FAIL docs-specs:a-marker-carries-a-question $f"; exit 1; };
          done; true' --

      # awk tracks the requirement heading it is inside, so a marker is charged
      # to the rule above it rather than to whatever heading falls in a fixed
      # context window.
      - id: marker-blocks-enactment
        name: no unit of work enacts a rule carrying an open question
        language: system
        files: '^_docs/(specs|plan)/.*\.md$'
        pass_filenames: false
        entry: >-
          sh -c 'awk "/^### /{id=\$2} /\\[NEEDS CLARIFICATION/{print id}" _docs/specs/SPEC-*.md |
          grep -oE "[a-z0-9-]+:[a-z0-9-]+" | sort -u > /tmp/marked;
          grep -rhoE "(ADDED|MODIFIED|REMOVED) .[a-z0-9-]+:[a-z0-9-]+." _docs/plan |
          grep -oE "[a-z0-9-]+:[a-z0-9-]+" | sort -u > /tmp/enacted;
          comm -12 /tmp/marked /tmp/enacted | grep . &&
          { echo "FAIL work enacts a rule carrying an open question"; exit 1; }; true'

      # The `Verify:` line of the requirement this hook enforces necessarily
      # contains the words the hook forbids, so it is excluded. A gate that
      # cannot coexist with its own definition is a gate nobody can ship.
      - id: no-self-narration
        name: documents state the present
        language: system
        types: [markdown]
        pass_filenames: true
        entry: >-
          sh -c 'for f; do
          grep -vn "^Verify: " "$f" | grep -iE "formerly|used to be|this replaces|previously we" &&
          { echo "FAIL docs-format:document-states-the-present $f"; exit 1; };
          done; true' --

      - id: fence-language
        name: every opening fence declares a language
        language: system
        types: [markdown]
        pass_filenames: true
        entry: >-
          awk '/^```/{ if(!inf){ inf=1; if($0=="```"){
          printf "FAIL docs-format:fence-declares-a-language %s:%d\n", FILENAME, FNR; bad=1 } }
          else inf=0; next } END{ exit bad }'

  # Tables of contents: generated, never hand-written, and gated for staleness.
  # The depth flag belongs to the parser subcommand, so it follows `github`.
  # At the top level `-l` means --no-links and `-l 3` is an error.
  - repo: https://github.com/frnmst/md-toc
    rev: 9.0.0
    hooks:
      - id: md-toc
        args: [-p, -c, --skip-lines, '1', github, -l, '3']

  - repo: local
    hooks:
      - id: md-toc-fresh
        name: tables of contents are current
        language: system
        files: '^_docs/specs/SPEC-[a-z0-9-]+\.md$'
        pass_filenames: true
        entry: >-
          sh -c 'for f; do grep -q "<!--TOC-->" "$f" || continue;
          md_toc -d -c -s 1 github -l 3 "$f" ||
          { echo "FAIL stale TOC in $f; run md_toc -p"; exit 1; }; done' --
