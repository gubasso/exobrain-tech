# The hook ids that each upstream manifest publishes at the rev that
# bash.yaml pins. .hooks/hook-sets-evidence.sh writes this file, and
# .hooks/hook-sets.sh holds the set to it offline.
repos:
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    ids: ["shellcheck"]
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    ids: ["shfmt","shfmt-src","shfmt-docker"]
