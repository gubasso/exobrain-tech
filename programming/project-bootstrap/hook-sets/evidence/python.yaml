# The hook ids that each upstream manifest publishes at the rev that
# python.yaml pins. .hooks/hook-sets-evidence.sh writes this file, and
# .hooks/hook-sets.sh holds the set to it offline.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    ids: ["ruff-check","ruff-format","ruff"]
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.414
    ids: ["pyright"]
