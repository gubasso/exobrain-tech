# The hooks this repository publishes. Each id is a public interface: it is
# never renamed or removed without a major release
# (ADR-exobrain-tech-publishes-pre-commit-hooks). The repository runs each
# expression on itself through a local twin in .pre-commit-config.yaml, and
# .hooks/test-gates.sh holds the two entries equal.
- id: no-path-flake-reference
  name: a flake reference reads the git tree, not a path copy
  description: project-platform:a-flake-is-read-from-its-git-tree
  language: pygrep
  types: [text]
  entry: '^(?!.*nix-path-ok).*(\bgetFlake\s*+(?:\(\s*+(?!\\?["''](?:git\+file:|/nix/store/))|\\?["''](?!git\+file:|/nix/store/))|(?<![\w-])path:(?!/nix/store/)[^\s`''"),\]:?\\0-9-])'  # nix-path-ok: the hook's own expression
- id: no-hook-runner-in-flake
  name: a flake holds no git hook runner
  description: project-platform:the-host-supplies-the-hook-runner
  language: pygrep
  files: '(^|/)flake\.nix$|(^|/)nix/.*\.nix$'
  entry: '^(?!\s*#)(?!.*hook-runner-ok)(?:\s*(?:pre-commit|prek)\s*(?:#.*)?$|(?:[^"#]|"(?:[^"\\$]|\\.|\$(?!\{)|\$\{(?:(?!\bpkgs\.(?:"(?:pre-commit|prek)"|(?:pre-commit|prek)(?![\w-])))[^}])*\})*")*?(?:\bpkgs\.(?:"(?:pre-commit|prek)"|(?:pre-commit|prek)(?![\w-]))|"(?:[^"\\$]|\\.|\$(?!\{)|\$\{(?:(?!\bpkgs\.(?:"(?:pre-commit|prek)"|(?:pre-commit|prek)(?![\w-])))[^}])*\})*\$\{[^}]*?\bpkgs\.(?:"(?:pre-commit|prek)"|(?:pre-commit|prek)(?![\w-]))|\bwith\s+pkgs\s*;(?:[^"#]|"(?:[^"\\$]|\\.|\$(?!\{)|\$\{(?:(?!\bpkgs\.(?:"(?:pre-commit|prek)"|(?:pre-commit|prek)(?![\w-])))[^}])*\})*")*?[\[\s](?:pre-commit|prek)(?=[\s\]])))'
- id: host-requirements
  name: host-requirements.toml parses
  description: project-platform:host-requirements-list-the-host-tools
  language: system
  entry: exobrain host-check --parse-only
  pass_filenames: false
  files: '^host-requirements\.toml$'
# The project names its sets in `args`, such as `[--set, common, --set, rust]`,
# and prek appends them after the entry. prek expands `{hook_repo}` to the
# clone of the tag that the `rev` of the entry pins, so the hook reads the sets
# of that tag. prek 0.5.0 is the oldest that expands it, and pre-commit passes
# it through as text. The host supplies `exobrain`.
- id: hook-revisions
  name: hook revisions follow the exobrain-tech tag
  description: project-platform:hook-revisions-follow-the-exobrain-tech-tag
  language: system
  entry: exobrain hooks check --sets-dir {hook_repo}/programming/project-bootstrap/hook-sets .pre-commit-config.yaml
  pass_filenames: false
  files: '^\.pre-commit-config\.yaml$'
  minimum_prek_version: "0.5.0"
